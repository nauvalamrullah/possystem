
{% include 'navbar.html' %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pembiayaan.css') }}">

<body>
    <div class="container mt-4">
        <h2 class="hero-title text-center">Investasi untuk <span class="highlight">{{ pembiayaan['business_name'] }}</span></h2>
        <p class="text-center mb-4">Dukung UMKM ini dengan kontribusi terbaikmu.</p>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm p-4">
                    <!-- Info Umum -->
                    <div class="mb-3">
                        <strong>Butuh Dana:</strong>
                        <p class="text-primary fs-5">Rp {{ '{:,.0f}'.format(pembiayaan['amount']) }}</p>
                    </div>

                    <div class="mb-3">
                        <strong>Deskripsi Usaha:</strong>
                        <p class="text-muted">{{ pembiayaan['description'] }}</p>
                    </div>

                    <div class="mb-3">
                        <strong>Dokumen Usaha:</strong><br>
                        <a href="{{ url_for('static', filename='dokumen/' ~ pembiayaan['document']) }}" target="_blank" class="btn btn-outline-secondary btn-sm">
                            Lihat Dokumen
                        </a>
                    </div>

                    <!-- Form Investasi -->
                    <form method="POST">
                        <div class="form-group mb-3">
                            <label for="jumlah"><strong>Jumlah Investasi (Rp)</strong></label>
                            <input type="number" class="form-control" id="jumlah" name="jumlah" placeholder="Contoh: 1000000" required min="10000">
                        </div>
                        <button type="submit" class="btn investment-btn w-100">Konfirmasi Investasi</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
