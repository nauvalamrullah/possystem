{% extends "dashboard.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Edit Produk</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nama Produk:</label>
                    <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Harga:</label>
                    <input type="number" name="price" class="form-control" value="{{ product.price }}" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Gambar (URL):</label>
                    <input type="text" name="image" class="form-control" value="{{ product.image }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Stok:</label>
                    <input type="number" name="stok" class="form-control" value="{{ product.stok }}" required>
                </div>
                
                
                <!-- Preview Gambar -->
                <div class="mb-3 text-center">
                    <img src="{{ product.image }}" id="previewImage" class="img-fluid rounded shadow" style="max-width: 200px;">
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-success px-4">
                        <i class="fas fa-save"></i> Simpan Perubahan
                    </button>
                    <a href="{{ url_for('kelola_produk') }}" class="btn btn-secondary px-4">
                        <i class="fas fa-times"></i> Batal
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- FontAwesome untuk ikon -->
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

<!-- Preview gambar otomatis saat input diubah -->
<script>
    document.querySelector('input[name="image"]').addEventListener('input', function() {
        document.getElementById('previewImage').src = this.value;
    });
</script>

{% endblock %}
