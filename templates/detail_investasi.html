<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Detail Investasi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h2 class="mb-4">Detail Investasi</h2>

        <div class="card shadow">
            <div class="card-body">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item"><strong>ID:</strong> {{ data.id }}</li>
                    <li class="list-group-item"><strong>ID Crowdfunding:</strong> {{ data.crowdfunding_id }}</li>
                    <li class="list-group-item"><strong>ID Investor:</strong> {{ data.investor_id }}</li>
                    <li class="list-group-item"><strong>Jumlah Investasi:</strong> Rp {{ "{:,.0f}".format(data.amount) }}</li>
                    <li class="list-group-item"><strong>Tanggal:</strong> {{ data.date }}</li>
                    <li class="list-group-item"><strong>Status:</strong> {{ data.status }}</li>
                </ul>

                <div class="mt-4">
                    <a href="{{ url_for('laporan_investasi') }}" class="btn btn-secondary">← Kembali</a>
                    <a href="{{ url_for('cetak_investasi_pdf', investasi_id=data.id) }}" class="btn btn-danger">
                        <i class="bi bi-file-earmark-pdf"></i> Unduh PDF
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- TIDAK DI AKTIFKAN SEMENTARA) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
