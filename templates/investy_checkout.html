{% extends 'dashboard.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">Checkout Investy</h2>
    <form method="POST" action="{{ url_for('checkout_investy') }}">
        <div class="mb-3">
            <label for="nama" class="form-label">Nama Pengguna</label>
            <input type="text" class="form-control" id="nama" name="nama" required>
        </div>
        <div class="mb-3">
            <label for="alamat" class="form-label">Alamat Penerima</label>
            <textarea class="form-control" id="alamat" name="alamat" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-success">Ajukan Pembelian</button>
    </form>
</div>
{% endblock %}
